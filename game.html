<!doctype html>
<html lang="en" class="dir-a">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Printable — Yapla</title>
  <link rel="stylesheet" href="assets/css/brand-tokens.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/print-game.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='40' rx='14' fill='%23FF5D5D'/%3E%3Crect x='15' y='14' width='14' height='24' rx='4.5' fill='%23fff'/%3E%3Crect x='34' y='14' width='14' height='24' rx='4.5' fill='%23FFC53D'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="container">
    <header class="site-header no-print">
      <a class="brand" href="index.html">
        <svg class="mark" width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
          <path class="mk-bubble" d="M16 45 L16 57 L29 45 Z"></path>
          <rect class="mk-bubble" x="6" y="6" width="52" height="40" rx="14"></rect>
          <rect class="mk-tile1" x="15" y="14" width="14" height="24" rx="4.5"></rect>
          <rect class="mk-tile2" x="34" y="14" width="14" height="24" rx="4.5"></rect>
        </svg>
        <div class="brand-text">
          <div class="title">Yap<span class="pl">la</span></div>
          <div class="sub">Speech &amp; Language Resources</div>
        </div>
      </a>
      <nav class="site-nav">
        <a class="nav-btn" href="index.html">Library</a>
      </nav>
    </header>

    <section class="fc-toolbar no-print">
      <div>
        <h1 class="fc-title" id="gTitle">Game</h1>
        <div class="fc-subtitle" id="gSubtitle"></div>
      </div>
      <div class="fc-actions">
        <a class="btn secondary" id="backBtn" href="#">← Back to cards</a>
        <button class="btn" id="printBtn">🖨️ Print sheet</button>
      </div>
    </section>

    <main id="page" class="print-page"></main>

    <footer class="foot no-print">One-page printable. Use letter or A4 paper.</footer>
  </div>

  <!-- Yapla mark — prints in the page footer -->
  <div class="print-brand" aria-hidden="true">
    <svg class="mark" viewBox="0 0 64 64" width="15" height="15">
      <rect class="mk-bubble" x="6" y="6" width="52" height="40" rx="14"></rect>
      <rect class="mk-tile1" x="15" y="14" width="14" height="24" rx="4.5"></rect>
      <rect class="mk-tile2" x="34" y="14" width="14" height="24" rx="4.5"></rect>
    </svg>
    <span class="wm">Yapla</span>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/game-print.js"></script>
</body>
</html>
